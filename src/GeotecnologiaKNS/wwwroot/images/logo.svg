<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="KNS Geotecnologia">
  <defs>
    <linearGradient id="kns-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2FA36B"/>
      <stop offset="100%" stop-color="#127A4B"/>
    </linearGradient>
  </defs>

  <!-- Marca: perímetro georreferenciado com vértices, folha ao centro e selo de validação.
       Une os três eixos do produto: geo, meio ambiente e conformidade. -->
  <g transform="translate(6 8)">
    <path d="M24 1 L45 12 L41 40 L24 47 L7 40 L3 12 Z"
          fill="none" stroke="url(#kns-mark)" stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- vértices do polígono -->
    <circle cx="24" cy="1"  r="2.6" fill="#2FA36B"/>
    <circle cx="45" cy="12" r="2.6" fill="#2FA36B"/>
    <circle cx="41" cy="40" r="2.6" fill="#2FA36B"/>
    <circle cx="24" cy="47" r="2.6" fill="#2FA36B"/>
    <circle cx="7"  cy="40" r="2.6" fill="#2FA36B"/>
    <circle cx="3"  cy="12" r="2.6" fill="#2FA36B"/>

    <!-- folha -->
    <path d="M24 12c7 3 10 9 9 16-7 1-12-3-13-9-1-3 1-6 4-7z"
          fill="url(#kns-mark)" opacity="0.92"/>
    <path d="M24 13c-4 5-5 11-2 18" fill="none" stroke="#0B4F31"
          stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Wordmark -->
  <text x="66" y="33" font-family="'Roboto','Segoe UI',system-ui,sans-serif"
        font-size="25" font-weight="700" letter-spacing="1.5" fill="#0F2E22">KNS</text>
  <text x="128" y="33" font-family="'Roboto','Segoe UI',system-ui,sans-serif"
        font-size="25" font-weight="300" letter-spacing="0.4" fill="#2FA36B">ambiental</text>
  <text x="67" y="49" font-family="'Roboto','Segoe UI',system-ui,sans-serif"
        font-size="9.5" font-weight="500" letter-spacing="3.1" fill="#6B7F76">GEOTECNOLOGIA</text>
</svg>
