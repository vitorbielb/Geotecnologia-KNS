services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: geotecnologiakns-postgis
    environment:
      POSTGRES_DB: geotecnologiakns_geo
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geotecnologiakns_geo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis-data:
